name: Search POC Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and package simulator app
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5
        with:
          persist-credentials: false

      - name: Setup environment
        run: source ci_scripts/ci_common.sh && setup_github_actions_environment

      - name: Run unit and preview tests
        run: swift run -q tools ci unit-tests

      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Debug-iphonesimulator/ElementX.app \
            ElementXSearch-Simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ElementXSearch-Simulator
          path: ElementXSearch-Simulator.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SearchPOC-Test-Results
          path: test_output/UnitTests.zip
          retention-days: 1
          if-no-files-found: ignore
